name: flutter_proximiio_map
description: Proximi.io venue map for Flutter, a platform view over the native Proximi.io Map v6 libraries for iOS and Android.
version: 6.0.0-beta.1
homepage: https://github.com/proximiio/flutter-proximiio-map
# Distributed from git tags, not pub.dev.
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_proximiio:
    git:
      url: https://github.com/proximiio/flutter-proximiio
      ref: 6.0.0-beta.1

dependency_overrides:
  # Development against the sibling checkout; remove before tagging a release.
  flutter_proximiio:
    path: ../flutter-proximiio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.3.4

flutter:
  plugin:
    platforms:
      android:
        package: io.proximi.flutter_proximiio_map
        pluginClass: FlutterProximiioMapPlugin
      ios:
        pluginClass: FlutterProximiioMapPlugin
